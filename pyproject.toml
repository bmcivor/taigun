[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "taigun"
version = "2.1.1"
description = "Write Taiga tickets directly to the database from the command line"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Blake McIvor" },
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
keywords = ["taiga", "taiga-6", "tickets", "cli", "project-management"]
dependencies = [
    "typer==0.25.1",
    "psycopg2-binary==2.9.12",
    "python-frontmatter==1.0.0",
    "tomli-w==1.2.0",
]

[project.urls]
Homepage = "https://github.com/bmcivor/taigun"
Repository = "https://github.com/bmcivor/taigun"
Issues = "https://github.com/bmcivor/taigun/issues"

[project.scripts]
taigun = "taigun.cli:app"

[dependency-groups]
dev = [
    "mypy==2.3.0",
    "pytest==9.0.2",
    "python-semantic-release==9.21.1",
    "ruff==0.16.1",
    "types-psycopg2>=2.9.21.20260724",
    "types-pyyaml>=6.0.12.20260724",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
build_command = "uv lock --no-cache --no-progress"
assets = ["uv.lock"]

[tool.semantic_release.branches.main]
match = "tag-release"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"

# python-frontmatter ships no stubs and no py.typed marker.
[[tool.mypy.overrides]]
module = ["frontmatter"]
ignore_missing_imports = true
